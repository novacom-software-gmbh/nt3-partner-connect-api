openapi: 3.0.3
info:
  title: NovaTouch® Partner.Connect IN API
  description: |
    Endpoints that partners call to push orders into NovaTouch.

    Flow:
    1. `POST /authorization/authorize` with the API key issued by novacom → authorization token (JWT).
    2. `POST /booking/order` with `Authorization: Bearer <token>` → the order is stored and booked
       at `bookAt` (or as soon as possible when `bookAt` is not set).

    Every response body carries a `status` object. `statusType` 1 (OK) means success; otherwise
    `statusMessageType` gives the detailed reason.
  version: 1.1.0
  contact:
    name: NovaTouch® Partner.Connect
    email: partner-connect@novacom.at
    url: https://www.novacom.at/de/

servers:
  - url: https://{host}:{port}/api/v1
    description: NovaTouch 3 Server Suite - Partner Connect listener
    variables:
      host:
        default: localhost
        description: Host of the NovaTouch 3 Server Suite installation
      port:
        default: "31504"
        description: Partner Connect port of the installation (configured per installation)

tags:
  - name: Authentication
    description: Partner authorization
  - name: Booking
    description: Order management

security:
  - AuthorizationToken: []

paths:
  # ============================================================================
  # AUTHENTICATION ENDPOINTS
  # ============================================================================

  /authorization/authorize:
    post:
      tags:
        - Authentication
      summary: Authorize partner
      description: |
        Authorizes a partner by its API key. Returns an authorization token (JWT) that contains
        client ID, point of sale ID, user ID, user permissions, partner ID, session ID, API key
        and expiration date. The token is valid for 24 hours; request a new one when a call
        returns statusMessageType 2006 (token expired).
      operationId: authorize
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorizeRequest'
      responses:
        '200':
          description: Authorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizeResponse'
        '400':
          description: Bad request - invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizeResponse'
        '401':
          description: Unauthorized - invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizeResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizeResponse'

  # ============================================================================
  # BOOKING ENDPOINTS
  # ============================================================================

  /booking/order:
    post:
      tags:
        - Booking
      summary: Create order
      description: |
        Stores an order with its items. The order is booked at `bookAt`, or as soon as possible
        when `bookAt` is not set. A successful response means the order was accepted and stored;
        the booking itself happens asynchronously.
        If `order.id` is set, the items are booked onto this existing order; otherwise a new order
        is created when the order is booked.
      operationId: order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderRequest'
      responses:
        '200':
          description: Order accepted and stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          description: Bad request - invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '401':
          description: Unauthorized - authorization token missing, invalid or expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'

components:
  securitySchemes:
    AuthorizationToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Authorization token obtained from `/authorization/authorize`.
        Send it as HTTP header `Authorization: Bearer <token>`.

  schemas:
    # ==========================================================================
    # COMMON SCHEMAS
    # ==========================================================================

    Status:
      type: object
      description: Status included in every response
      properties:
        statusType:
          type: integer
          description: Status type (1 = OK)
          enum:
            - 0
            - 1
            - 2
            - 3
          x-enum-varnames:
            - STATUSTYPE_UNKNOWN
            - STATUSTYPE_OK
            - STATUSTYPE_ERROR
            - STATUSTYPE_WARNING
          example: 1
        statusMessageType:
          type: integer
          description: Detailed status (100 = success)
          enum:
            - 0
            - 100
            - 101
            - 102
            - 200
            - 300
            - 301
            - 1000
            - 1001
            - 1002
            - 2000
            - 2001
            - 2002
            - 2003
            - 2004
            - 2005
            - 2006
            - 2007
            - 2008
            - 2009
            - 3000
            - 3001
            - 3002
            - 3003
            - 3004
            - 3005
            - 3006
            - 3007
            - 3008
            - 4000
            - 4001
            - 4002
            - 4003
            - 4004
            - 4005
            - 4006
            - 4007
            - 4008
            - 4009
            - 4010
            - 4011
            - 4012
            - 4013
            - 4014
            - 4015
            - 4016
            - 4017
            - 4018
            - 4019
            - 4020
            - 4021
            - 4022
            - 4023
            - 4025
            - 4031
            - 5000
            - 5001
            - 5002
            - 5003
            - 5004
            - 6000
            - 6001
            - 7000
            - 7001
            - 7002
            - 7003
            - 7004
            - 7005
            - 7006
            - 7007
            - 7008
          x-enum-varnames:
            - STATUSMESSAGETYPE_UNKNOWN
            - STATUSMESSAGETYPE_SUCCESS
            - STATUSMESSAGETYPE_SUCCESS_PRICES_MODIFIED
            - STATUSMESSAGETYPE_SUCCESS_PRICES_NOT_MODIFIED
            - STATUSMESSAGETYPE_ERROR
            - STATUSMESSAGETYPE_WARNING
            - STATUSMESSAGETYPE_WARNING_MESSAGE_WAS_ALREADY_SENT
            - STATUSMESSAGETYPE_ERROR_PARAMETER
            - STATUSMESSAGETYPE_ERROR_PARAMETER_MISSING
            - STATUSMESSAGETYPE_ERROR_PARAMETER_INVALID
            - STATUSMESSAGETYPE_ERROR_AUTH
            - STATUSMESSAGETYPE_ERROR_AUTH_USER_NOT_FOUND
            - STATUSMESSAGETYPE_ERROR_AUTH_PIN_MISSING
            - STATUSMESSAGETYPE_ERROR_AUTH_PIN_INVALID
            - STATUSMESSAGETYPE_ERROR_AUTH_AUTHORIZATION_TOKEN_MISSING
            - STATUSMESSAGETYPE_ERROR_AUTH_AUTHORIZATION_TOKEN_INVALID
            - STATUSMESSAGETYPE_ERROR_AUTH_AUTHORIZATION_TOKEN_EXPIRED
            - STATUSMESSAGETYPE_ERROR_AUTH_LOGIN_TOKEN_MISSING
            - STATUSMESSAGETYPE_ERROR_AUTH_LOGIN_TOKEN_INVALID
            - STATUSMESSAGETYPE_ERROR_AUTH_LOGIN_TOKEN_EXPIRED
            - STATUSMESSAGETYPE_ERROR_FISCALIZATION
            - STATUSMESSAGETYPE_ERROR_FISCALIZATION_OUT_OF_SERVICE
            - STATUSMESSAGETYPE_ERROR_FISCALIZATION_TEMPORARY_OUT_OF_SERVICE
            - STATUSMESSAGETYPE_ERROR_FISCALIZATION_PERMANENTLY_OUT_OF_SERVICE
            - STATUSMESSAGETYPE_ERROR_FISCALIZATION_SUBSEQUENT_ENTRY_ACTIVATED
            - STATUSMESSAGETYPE_ERROR_FISCALIZATION_MONTHLY_REPORT_DUE
            - STATUSMESSAGETYPE_ERROR_FISCALIZATION_ANNUAL_REPORT_DUE
            - STATUSMESSAGETYPE_ERROR_FISCALIZATION_MESSAGE_PENDING
            - STATUSMESSAGETYPE_ERROR_FISCALIZATION_BACKUP_DEVICE_IN_USE
            - STATUSMESSAGETYPE_ERROR_PERMISSION
            - STATUSMESSAGETYPE_ERROR_PERMISSION_OPEN_ORDER
            - STATUSMESSAGETYPE_ERROR_PERMISSION_CREATE_INVOICE
            - STATUSMESSAGETYPE_ERROR_PERMISSION_BOOK_ARTICLES
            - STATUSMESSAGETYPE_ERROR_PERMISSION_CANCEL_BOOKING
            - STATUSMESSAGETYPE_ERROR_PERMISSION_CANCEL_INVOICE
            - STATUSMESSAGETYPE_ERROR_PERMISSION_CHANGE_TRANSACTION_TYPE_BOOKING
            - STATUSMESSAGETYPE_ERROR_PERMISSION_CHANGE_PAYMENT_TYPE_INVOICE
            - STATUSMESSAGETYPE_ERROR_PERMISSION_CHANGE_TRANSACTION_TYPE_INVOICE
            - STATUSMESSAGETYPE_ERROR_PERMISSION_PREBOOK_ARTICLES
            - STATUSMESSAGETYPE_ERROR_PERMISSION_ACCESS_POS_MAINTENANCE_FUNCTIONS
            - STATUSMESSAGETYPE_ERROR_PERMISSION_CHANGE_ORDER_ID
            - STATUSMESSAGETYPE_ERROR_PERMISSION_SPLIT_ORDER
            - STATUSMESSAGETYPE_ERROR_PERMISSION_SELECT_OUTLET_ON_INVOICE_CREATION
            - STATUSMESSAGETYPE_ERROR_PERMISSION_INPUT_TIP
            - STATUSMESSAGETYPE_ERROR_PERMISSION_SHOW_CREATED_INVOICES
            - STATUSMESSAGETYPE_ERROR_PERMISSION_FETCH_ORDERS_FROM_OTHER_USER
            - STATUSMESSAGETYPE_ERROR_PERMISSION_FETCH_ORDERS_FROM_OTHER_OUTLET
            - STATUSMESSAGETYPE_ERROR_PERMISSION_CHANGE_POINT_OF_SALE
            - STATUSMESSAGETYPE_ERROR_PERMISSION_ACCESS_POS_SYSTEM_FUNCTIONS
            - STATUSMESSAGETYPE_ERROR_PERMISSION_GUEST_INFORMATION_FROM_PARTNER
            - STATUSMESSAGETYPE_ERROR_PERMISSION_CARD_INFORMATION_FROM_PARTNER
            - STATUSMESSAGETYPE_ERROR_PERMISSION_VOUCHER_INFORMATION_FROM_PARTNER
            - STATUSMESSAGETYPE_ERROR_PERMISSION_SHOW_OLDER_INVOICES
            - STATUSMESSAGETYPE_ERROR_PERMISSION_NEGATIVE_VALUES_FOR_MANUAL_PRICE
            - STATUSMESSAGETYPE_ERROR_PERMISSION_FISCAL_MANAGEMENT
            - STATUSMESSAGETYPE_ERROR_BOOKING
            - STATUSMESSAGETYPE_ERROR_BOOKING_ORDER_LOCKED_BY_POS
            - STATUSMESSAGETYPE_ERROR_BOOKING_ORDER_NOT_FOUND
            - STATUSMESSAGETYPE_ERROR_BOOKING_ORDER_LOCKED_BY_USER
            - STATUSMESSAGETYPE_ERROR_BOOKING_ORDER_ROOM_NOT_OCCUPIED
            - STATUSMESSAGETYPE_ERROR_INVOICE
            - STATUSMESSAGETYPE_ERROR_INVOICE_PAYMENT_MISMATCH
            - STATUSMESSAGETYPE_ERROR_PARTNER
            - STATUSMESSAGETYPE_ERROR_PARTNER_RESPONSE
            - STATUSMESSAGETYPE_ERROR_PARTNER_PARAMETER_MISSING
            - STATUSMESSAGETYPE_ERROR_PARTNER_CONFIG_NOT_FOUND
            - STATUSMESSAGETYPE_ERROR_PARTNER_COMMUNICATION_ERROR
            - STATUSMESSAGETYPE_ERROR_PARTNER_MEDIUM_NOT_ALLOWED
            - STATUSMESSAGETYPE_ERROR_PARTNER_MEDIUM_INSUFFICIENT_BALANCE
            - STATUSMESSAGETYPE_ERROR_PARTNER_MEDIUM_DOES_NOT_EXIST
            - STATUSMESSAGETYPE_ERROR_PARTNER_MEDIUM_NOT_ACTIVATED
          example: 100
        message:
          type: string
          description: Human-readable status message
          example: "Success"
      required:
        - statusType
        - statusMessageType

    # ==========================================================================
    # AUTHENTICATION SCHEMAS
    # ==========================================================================

    AuthorizeRequest:
      type: object
      description: Request to authorize a partner
      properties:
        apiKey:
          type: string
          description: API key issued by novacom
          example: "ak_live_xxxxxxxxxxxxx"
      required:
        - apiKey

    AuthorizeResponse:
      type: object
      description: Response of the authorization
      properties:
        status:
          $ref: '#/components/schemas/Status'
        authorizationToken:
          type: string
          description: |
            JWT containing client ID, point of sale ID, user ID, user permissions, partner ID,
            session ID, API key and expiration date. Only set when statusType is 1 (OK).
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
      required:
        - status

    # ==========================================================================
    # ORDER REQUEST/RESPONSE SCHEMAS
    # ==========================================================================

    OrderRequest:
      type: object
      description: Order with the items to book. Can optionally be connected to partner ids (e.g. a hotel room).
      properties:
        order:
          $ref: '#/components/schemas/Order'
        items:
          type: array
          description: Items to book
          minItems: 1
          items:
            $ref: '#/components/schemas/OrderItem'
      required:
        - order
        - items

    OrderResponse:
      type: object
      description: Response after the order was stored
      properties:
        status:
          $ref: '#/components/schemas/Status'
        orderId:
          type: string
          description: |
            ID of the order if it was given in the request (`order.id`).
            Empty for new orders - their ID is assigned when the order is booked.
          example: "101"
      required:
        - status

    # ==========================================================================
    # ORDER SCHEMAS
    # ==========================================================================

    Order:
      type: object
      description: Order data
      properties:
        id:
          type: string
          description: ID of an existing order to book onto. If not set, a new order is created.
          example: "101"
        name:
          type: string
          description: Order name, e.g. a regular customer, reservation, etc.
          example: "Max Mustermann"
        bookAt:
          type: string
          format: date-time
          description: |
            Time at which the order is booked (ISO 8601). A time without offset is treated as UTC.
            If not set, the order is booked as soon as possible.
          example: "2024-01-01T00:00:00Z"
        connectedIds:
          type: array
          description: IDs connected to this order (table, hotel room, access chip, voucher, ...)
          items:
            $ref: '#/components/schemas/ConnectedId'

    # ==========================================================================
    # BOOKING SCHEMAS
    # ==========================================================================

    OrderItem:
      type: object
      description: Item within an order
      properties:
        articleId:
          type: string
          description: Article ID (must exist in NovaTouch)
          example: "1001"
        name:
          type: string
          description: Name of the item
          example: "Cheeseburger"
        quantity:
          type: number
          format: double
          description: Quantity ordered. Default 1.
          default: 1
          example: 2.0
        price:
          type: number
          format: double
          description: Price per item (without discount/grant, happy hour already applied)
          example: 12.50
        isPreorder:
          type: boolean
          description: If set, the item is only preordered and has to be processed manually on the POS.
          default: false
          example: true
        modifiers:
          type: array
          description: Modifiers applied to this item
          items:
            $ref: '#/components/schemas/Modifier'
      required:
        - articleId

    Modifier:
      type: object
      description: Each property can be provided on its own or in combination with one or more other properties. If an article ID is provided, it must exist in NovaTouch.
      properties:
        articleId:
          type: string
          description: Article ID of the modifier
          example: "9001"
        name:
          type: string
          description: Name of the modifier
          example: "Extra Cheese"
        price:
          type: number
          format: double
          description: Price of the modifier
          example: 1.50

    # ==========================================================================
    # PARTNER SCHEMAS
    # ==========================================================================

    ConnectedId:
      type: object
      description: ID connected to an order
      properties:
        id:
          type: string
          description: |
            Unique identifier, e.g.
            - table ID,
            - room number for hotel,
            - chip ID for access partner,
            - QR code for voucher, etc.
          example: "101"
        partnerId:
          type: string
          description: Unique identifier of the partner system as specified by novacom
          example: "GrandHotelPMS"
        type:
          type: string
          description: Type of this connected ID
          enum:
            - HOTEL
            - VOUCHER
            - ACCESS
            - TABLE
          example: "HOTEL"
      required:
        - id

    # ==========================================================================
    # PERMISSIONS
    # ==========================================================================
    # Permissions are encoded as a 32-bit integer. Each bit represents a 
    # permission for the user. 0 = denied, 1 = granted.
    #
    # BIT  Permission
    # =========================================================================
    # 1    Open Order
    # 2    Create invoice
    # 3    Book articles
    # 4    Cancel booking
    # 5    Cancel invoice
    # 6    Change transaction type for booking
    # 7    Change payment type for existing invoice
    # 8    Change transaction type for existing invoice
    # 9    Prebook articles
    # 10   Access POS maintenance functions
    # 11   Change order id
    # 12   Split order
    # 13   Select outlet on invoice creation
    # 14   Input tip
    # 15   Show created invoices
    # 16   Fetch orders from other user
    # 17   Fetch orders from other outlet
    # 18   Change point of sale
    # 19   Access POS system functions
    # 20   Guest information from partner
    # 21   Card information from partner
    # 22   Voucher information from partner
    # 23   Show older invoices (older than today)
    # 24   Instant cancellation for bookings and prebooked articles
    # 25   Allow negative values for manual price changes
    # 26   Allow printing of preview invoices
    # 27   Allow booking when stock amount is zero
    # 28   Allow negative quantity for bookings
    # 29   Allow zero for guest count
    # 30   Allow switching to table booking from Self-Service
    # 31   Fiscal management access
    # =========================================================================