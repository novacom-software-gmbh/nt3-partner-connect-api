          description: Payment type ID
          example: "payment-cash"
        amount:
          type: number
          format: float
          description: Payment amount
          example: 50.00
        tip:
          type: number
          format: float
          description: Tip amount
          example: 5.00
        data:
          type: string
          description: Additional payment data as JSON
          example: '{"note": "Exact change"}'
        paymentHandledByPartner:
          type: boolean
          description: Payment was handled by external partner
          example: false
        partnerPaymentData:
          $ref: '#/components/schemas/PartnerPaymentData'
        binaryData:
          type: array
          description: Binary data (e.g., signature image)
          items:
            $ref: '#/components/schemas/BinaryData'
      required:
        - paymentTypeId
        - amount

    InvoiceItem:
      type: object
      description: Line item on an invoice
      properties:
        articleId:
          type: string
          description: Article ID
          example: "article-001"
        name:
          type: string
          description: Article name
          example: "Cheeseburger"
        quantity:
          type: number
          format: double
          description: Quantity
          example: 2.0
        price:
          type: number
          format: float
          description: Price per item
          example: 12.50
        vatRate:
          type: number
          format: float
          description: VAT rate
          example: 0.19
        vatRateType:
          $ref: '#/components/schemas/TaxType'
        additionalVatRate:
          type: number
          format: float
          description: Additional VAT rate if applicable
          example: 0.0
        additionalVatRateType:
          $ref: '#/components/schemas/TaxType'
        transactionTypeId:
          type: string
          description: Transaction type ID
          example: "trans-001"
        weight:
          type: number
          format: double
          description: Weight if scale was used
          example: 0.5
        discountAmount:
          type: number
          format: float
          description: Discount amount
          example: 2.50
        discountId:
          type: string
          description: Discount ID
          example: "discount-001"
        discountName:
          type: string
          description: Discount name
          example: "Staff Discount"
        happyHourDiscountAmount:
          type: number
          format: float
          description: Happy hour discount amount
          example: 1.00
        happyHourDiscountId:
          type: string
          description: Happy hour discount ID
          example: "happyhour-001"
        happyHourDiscountName:
          type: string
          description: Happy hour discount name
          example: "Evening Special"
        grantAmount:
          type: number
          format: float
          description: Grant amount
          example: 5.00
        grantId:
          type: string
          description: Grant ID
          example: "grant-001"
        grantName:
          type: string
          description: Grant name
          example: "All-Inclusive"
        unitDescription:
          type: string
          description: Unit description
          example: "pcs"
        articleGroupId:
          type: string
          description: Article group ID
          example: "group-food"
        articleGroupName:
          type: string
          description: Article group name
          example: "Food"
        modifiers:
          type: array
          description: Modifiers
          items:
            $ref: '#/components/schemas/Modifier'

    InvoicePaymentItem:
      type: object
      description: Payment line item on an invoice
      properties:
        paymentTypeId:
          type: string
          description: Payment type ID
          example: "payment-cash"
        name:
          type: string
          description: Payment type name
          example: "Cash"
        total:
          type: number
          format: float
          description: Total payment amount
          example: 50.00
        quantity:
          type: number
          format: double
          description: Quantity (usually 1)
          example: 1.0
        isTip:
          type: boolean
          description: Whether this is a tip payment
          example: false
        paymentTypeMode:
          $ref: '#/components/schemas/PaymentTypeMode'
        data:
          type: string
          description: Additional payment data
          example: '{"note": "Exact change"}'
        partnerPaymentData:
          $ref: '#/components/schemas/PartnerPaymentData'

    Invoice:
      type: object
      description: |
        Full invoice details. The invoiceData field may contain:
        - "terminalId"
      properties:
        id:
          type: string
          description: Internal invoice ID (used for cancellation, etc.)
          example: "inv-001"
        idDisplay:
          type: string
          description: Invoice ID displayed to user
          example: "INV-2024-0001"
        orderId:
          type: string
          description: Associated order ID
          example: "order-001"
        subOrderId:
          type: string
          description: Associated sub-order ID
          example: "suborder-001"
        createdAt:
          type: string
          description: Creation timestamp
          example: "2024-01-15T14:00:00Z"
        total:
          type: number
          format: float
          description: Total invoice amount
          example: 55.00
        userId:
          type: string
          description: User who created the invoice
          example: "user-001"
        isCancellation:
          type: boolean
          description: Whether this is a cancellation invoice
          example: false
        guestCount:
          type: integer
          description: Number of guests
          example: 4
        invoiceData:
          type: string
          description: Additional invoice data as JSON
          example: '{"terminalId": "terminal-001"}'
        pointOfSaleId:
          type: string
          description: Point of sale where invoice was created
          example: "pos-001"
        items:
          type: array
          description: Invoice line items
          items:
            $ref: '#/components/schemas/InvoiceItem'
        payments:
          type: array
          description: Payment line items
          items:
            $ref: '#/components/schemas/InvoicePaymentItem'
        signatures:
          type: array
          description: Fiscalization signatures
          items:
            $ref: '#/components/schemas/SignatureItem'
        transactionTypeId:
          type: string
          description: Transaction type ID
          example: "trans-001"
        cancelledByUserId:
          type: string
          description: User who cancelled (if cancellation)
          example: "user-001"
        cancelledAt:
          type: string
          description: Cancellation timestamp
          example: "2024-01-15T15:00:00Z"
        cancellationReason:
          type: string
          description: Reason for cancellation
          example: "Customer request"
        cancellationAuthorizedByUserId:
          type: string
          description: User who authorized cancellation
          example: "user-manager"
        cancellationReferenceId:
          type: string
          description: Reference to original/cancellation invoice
          example: "inv-original"
        transactionId:
          type: string
          description: Cached transaction ID
          example: "txn-001"
      required:
        - id
        - idDisplay
        - orderId
        - createdAt
        - total
        - userId
        - isCancellation

    InvoiceListItem:
      type: object
      description: Lightweight invoice list item
      properties:
        id:
          type: string
          description: Internal invoice ID
          example: "inv-001"
        idDisplay:
          type: string
          description: Display invoice ID
          example: "INV-2024-0001"
        orderId:
          type: string
          description: Associated order ID
          example: "order-001"
        subOrderId:
          type: string
          description: Associated sub-order ID
          example: "suborder-001"
        createdAt:
          type: string
          description: Creation timestamp
          example: "2024-01-15T14:00:00Z"
        total:
          type: number
          format: float
          description: Total amount
          example: 55.00
        userId:
          type: string
          description: User who created the invoice
          example: "user-001"
        isCancellation:
          type: boolean
          description: Whether this is a cancellation
          example: false
        info:
          type: string
          description: Additional info (hotel room, guest, etc.)
          example: "Room 101 - Smith"
      required:
        - id
