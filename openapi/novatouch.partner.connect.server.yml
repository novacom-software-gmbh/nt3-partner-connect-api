components:
  securitySchemes:
    AuthorizationToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Device authorization token obtained from the /authorization/authorize endpoint

    LoginToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: User login token obtained from the /authorization/login endpoint

  schemas:
    # ==========================================================================
    # COMMON SCHEMAS
    # ==========================================================================

    Status:
      type: object
      description: Standard status response included in all API responses
      properties:
        code:
          type: integer
          description: Status code (0 for success, non-zero for errors)
          example: 0
        message:
          type: string
          description: Human-readable status message
          example: "Success"
      required:
        - code

    Header:
      type: object
      description: Standard request header included in authenticated requests
      properties:
        authorizationToken:
          type: string
          description: Device authorization token
        loginToken:
          type: string
          description: User login token
        timestamp:
          type: string
          format: date-time
          description: Request timestamp in ISO 8601 format
      required:
        - authorizationToken

    BinaryData:
      type: object
      description: Binary data container (e.g., image, audio)
      properties:
        type:
          $ref: '#/components/schemas/BinaryType'
        byteData:
          type: string
          format: byte
          description: Binary data as base64 encoded string
          example: "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg=="
        stringData:
          type: string
          description: String representation of the data (e.g., URL, path)
          example: "https://example.com/images/burger.png"
        data:
          type: string
          description: Additional information as JSON format
          example: '{"width": 200, "height": 200}'
      required:
        - type

    ModifierFunction:
      type: object
      description: Preselection modifier with a defined factor
      properties:
        id:
          type: string
          description: Unique identifier of the modifier
          example: "modifier-extra"
        name:
          type: string
          description: Display name of the modifier
          example: "Extra"
        factor:
          type: number
          format: double
          description: Factor to apply (e.g., 0.5 for half, 2.0 for double)
          example: 1.5

    # ==========================================================================
    # AUTHENTICATION SCHEMAS
    # ==========================================================================

    AuthorizeRequest:
      type: object
      description: Request to authorize a device
      properties:
        apiKey:
          type: string
          description: API key for device authorization
          example: "ak_live_xxxxxxxxxxxxx"
        deviceData:
          type: string
          description: Device information in JSON format
          example: '{"deviceId": "device-001", "model": "iPad Pro", "os": "iOS 17"}'
      required:
        - apiKey

    AuthorizeResponse:
      type: object
      description: Response from device authorization
      properties:
        status:
          $ref: '#/components/schemas/Status'
        authorizationToken:
          type: string
          description: JWT token containing device permissions, customer ID, and client ID
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        clientId:
          type: string
          description: Unique identifier for the client
          example: "client-001"
        customerId:
          type: string
          description: Unique identifier for the customer
          example: "cust-001"
        pointsOfSale:
          type: array
          description: List of points of sale available for this device
          items:
            $ref: '#/components/schemas/PointOfSale'
        users:
          type: array
          description: List of users that can log in on this device
          items:
            $ref: '#/components/schemas/User'
      required:
        - status

    LoginRequest:
      type: object
      description: Request to log in a user
      properties:
        header:
          $ref: '#/components/schemas/Header'
        userId:
          type: string
          description: Unique identifier of the user
          example: "user-001"
        password:
          type: string
          format: password
          description: User password (plaintext or hashed depending on configuration)
          example: "********"
        pointOfSaleId:
          type: string
          description: Point of sale to log in to
          example: "pos-001"
      required:
        - header
        - userId
        - password
        - pointOfSaleId

    LoginResponse:
      type: object
      description: Response from user login
      properties:
        status:
          $ref: '#/components/schemas/Status'
        loginToken:
          type: string
          description: JWT token containing user permissions and user ID
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        user:
          $ref: '#/components/schemas/User'
        pointOfSale:
          $ref: '#/components/schemas/PointOfSale'
        permissions:
          type: array
          description: List of permissions granted to the user
          items:
            type: string
          example: ["CREATE_ORDER", "VOID_ORDER", "CREATE_INVOICE"]
      required:
        - status

    LogoutRequest:
      type: object
      description: Request to log out the current user
      properties:
        header:
          $ref: '#/components/schemas/Header'
      required:
        - header

    LogoutResponse:
      type: object
      description: Response from user logout
      properties:
        status:
          $ref: '#/components/schemas/Status'
      required:
        - status

    # ==========================================================================
    # SYSTEM SCHEMAS
    # ==========================================================================

    CheckServiceResponse:
      type: object
      description: Response from the service health check endpoint
      properties:
        status:
          $ref: '#/components/schemas/Status'
      required:
        - status

    ChangePointOfSaleRequest:
      type: object
      description: Request to change the active point of sale
      properties:
        header:
          $ref: '#/components/schemas/Header'
        pointOfSaleId:
          type: string
          description: Unique identifier of the point of sale to switch to
          example: "pos-001"
      required:
        - header
        - pointOfSaleId

    ChangePointOfSaleResponse:
      type: object
      description: Response after attempting to change the point of sale
      properties:
        status:
          $ref: '#/components/schemas/Status'
        loginToken:
          type: string
          description: New login token containing permissions for the new point of sale (only present if change was successful)
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        pointOfSale:
          $ref: '#/components/schemas/PointOfSale'
      required:
        - status

    SetLogLevelRequest:
      type: object
      description: Request to change the logging level for a specific log type
      properties:
        header:
          $ref: '#/components/schemas/Header'
        logType:
          $ref: '#/components/schemas/LogType'
        logLevelType:
          $ref: '#/components/schemas/LogLevelType'
      required:
        - header
        - logType
        - logLevelType

    SetLogLevelResponse:
      type: object
      description: Response after setting the log level
      properties:
        status:
          $ref: '#/components/schemas/Status'
      required:
        - status

    GetLogLevelRequest:
      type: object
      description: Request to retrieve the current log level for a specific log type
      properties:
        header:
          $ref: '#/components/schemas/Header'
        logType:
          $ref: '#/components/schemas/LogType'
      required:
        - header
        - logType

    GetLogLevelResponse:
      type: object
      description: Response containing the current log level for the requested log type
      properties:
        status:
          $ref: '#/components/schemas/Status'
        logLevelType:
          $ref: '#/components/schemas/LogLevelType'
      required:
        - status

    AddLogEntryRequest:
      type: object
      description: Request to add a new entry to the system logs
      properties:
        header:
          $ref: '#/components/schemas/Header'
        logType:
          $ref: '#/components/schemas/LogType'
        logLevelType:
          $ref: '#/components/schemas/LogLevelType'
        message:
          type: string
          description: The log message content
          example: "User session started successfully"
        moduleName:
          type: string
          description: Name of the main module or microservice that generated the log entry
          example: "Booking"
        functionName:
          type: string
          description: Name of the method or function that generated the log entry
          example: "add_articles"
        traceId:
          type: string
          description: Trace ID to correlate related log entries. If not provided, the internal application trace ID is used
          example: "trace-abc123-def456"
        ioType:
          type: string
          description: Indicates the I/O direction when logging data transmission
          enum:
            - IN
            - OUT
          example: "IN"
      required:
        - header
        - logType
        - logLevelType

    AddLogEntryResponse:
      type: object
      description: Response after adding a log entry
      properties:
        status:
          $ref: '#/components/schemas/Status'
      required:
        - status

    # ==========================================================================
    # BASE DATA SCHEMAS
    # ==========================================================================

    PointOfSale:
      type: object
      description: Point of sale configuration and settings
      properties:
        id:
          type: string
          description: Unique identifier of the point of sale
          example: "pos-001"
        name:
          type: string
          description: Display name of the point of sale
          example: "Main Restaurant"
        outlet:
          $ref: '#/components/schemas/Outlet'
        workflowType:
          $ref: '#/components/schemas/WorkflowType'
        workflowSettings:
          description: Additional settings depending on workflow type (oneOf)
          oneOf:
            - $ref: '#/components/schemas/WorkflowSettingsTableService'
            - $ref: '#/components/schemas/WorkflowSettingsSelfService'
            - $ref: '#/components/schemas/WorkflowSettingsSelfOrder'
        askForCancellationReason:
          type: boolean
          description: If true, the user is asked for a cancellation reason when cancelling an item
          example: true
        askForGuestCount:
          $ref: '#/components/schemas/AskForGuestCountType'
        askForOutlet:
          $ref: '#/components/schemas/AskForOutletType'
        bookOnLogout:
          type: boolean
          description: Book all open items on logout (e.g., on key removal)
          example: false
        logoutAfterSeconds:
          type: integer
          description: Timeout in seconds after which the device needs to log out
          example: 300
        orderDisplayOption:
          $ref: '#/components/schemas/PointOfSaleOrderDisplayOption'
        hardware:
          type: array
          description: Hardware connected to this point of sale
          items:
            $ref: '#/components/schemas/Hardware'
        currency:
          type: string
          description: Currency code for the point of sale
          example: "EUR"
        mediumWorkflowType:
          $ref: '#/components/schemas/MediumWorkflowType'
        allowManualMediumIdEntry:
          type: boolean
          description: If true, manual entry of medium ID is allowed
          example: true
      required:
        - id
        - name

    Hardware:
      type: object
      description: Hardware device connected to a point of sale
      properties:
        type:
          $ref: '#/components/schemas/HardwareType'
        id:
          type: string
          description: Unique identifier of the hardware
          example: "printer-001"
        name:
          type: string
          description: Display name of the hardware
          example: "Kitchen Printer"
        data:
          type: string
          description: Device connection string, URL, or configuration data
          example: "192.168.1.100:9100"
      required:
        - type
        - id
        - name
        - data

    WorkflowSettingsTableService:
      type: object
      description: Settings for table service workflow
      properties:
        allowBookingByAnyone:
          type: boolean
          description: If true, booking can be done by any user; otherwise only by the order owner
          example: false
        allowInvoicingByAnyone:
          type: boolean
          description: If true, invoicing can be done by any user; otherwise only by the order owner
          example: false

    WorkflowSettingsSelfService:
      type: object
      description: Settings for self service workflow (no additional settings currently)

    WorkflowSettingsSelfOrder:
      type: object
      description: Settings for self order workflow
      properties:
        paymentTypeId:
          type: string
          description: Default payment type for self orders
          example: "payment-card"
        maxItems:
          type: integer
          description: Maximum number of items per order
          example: 50

    Outlet:
      type: object
      description: Service area or outlet
      properties:
        id:
          type: string
          description: Unique identifier of the outlet
          example: "outlet-001"
        name:
          type: string
          description: Display name of the outlet
          example: "Terrace"
        alternativeVatRateName:
          type: string
          description: Name of an alternative VAT rate. If provided, user is asked if this rate should be used
          example: "Take-away VAT"
      required:
        - id
        - name

    Discount:
      type: object
      description: Discount definition
      properties:
        id:
          type: string
          description: Unique identifier of the discount
          example: "discount-001"
        name:
          type: string
          description: Display name of the discount
          example: "Happy Hour 20%"
      required:
        - id
        - name

    User:
      type: object
      description: User information
      properties:
        id:
          type: string
          description: Unique identifier of the user
          example: "user-001"
        name:
          type: string
          description: Display name of the user
          example: "John Smith"
      required:
        - id
        - name

    Course:
      type: object
      description: Course within a course group (e.g., starter, main, dessert)
      properties:
        id:
          type: string
          description: Unique identifier of the course
          example: "course-main"
        name:
          type: string
          description: Display name of the course
          example: "Main Course"
      required:
        - id
        - name

    CourseGroup:
      type: object
      description: Group of courses for organizing order items
      properties:
        id:
          type: string
          description: Unique identifier of the course group
          example: "coursegroup-001"
        name:
          type: string
          description: Display name of the course group
          example: "Dinner Courses"
        courses:
          type: array
          description: List of courses in this group
          items:
            $ref: '#/components/schemas/Course'
      required:
        - id
        - name

    TransactionType:
      type: object
      description: Transaction type definition
      properties:
        id:
          type: string
          description: Unique identifier of the transaction type
          example: "trans-001"
        name:
          type: string
          description: Display name of the transaction type
          example: "Sale"
      required:
        - id
        - name

    PaymentType:
      type: object
      description: Payment type configuration
      properties:
        id:
          type: string
          description: Unique identifier of the payment type
          example: "payment-cash"
        name:
          type: string
          description: Display name of the payment type
          example: "Cash"
        partner:
          $ref: '#/components/schemas/Partner'
        signatureRequired:
          type: boolean
          description: If true, signature is required for this payment type
          example: false
        type:
          $ref: '#/components/schemas/PaymentTypeMode'
        tipAllowed:
          type: boolean
          description: If true, tip can be added to the payment
          example: true
        splittingAllowed:
          type: boolean
          description: If true, this payment type can be used along with other payment types
          example: true
        inputType:
          $ref: '#/components/schemas/InputType'
      required:
        - id
        - name
        - type
        - inputType

    Menu:
      type: object
      description: Menu configuration containing menu items
      properties:
        id:
          type: string
          description: Unique identifier of the menu
          example: "menu-main"
        name:
          type: string
          description: Display name of the menu
          example: "Main Menu"
        menuItems:
          type: array
          description: Menu items and their positions
          items:
            $ref: '#/components/schemas/MenuItem'
        type:
          $ref: '#/components/schemas/MenuType'
        rows:
          type: integer
          description: Number of rows in the menu grid
          example: 6
        cols:
          type: integer
          description: Number of columns in the menu grid
          example: 8
        minModifiers:
          type: integer
          description: Minimum number of modifiers to select (for modifier menus)
          example: 0
        maxModifiers:
          type: integer
          description: Maximum number of modifiers to select (for modifier menus)
          example: 5
        nextModifierMenuId:
          type: string
          description: Next modifier menu to show (for modifier menus)
          example: "menu-modifiers-2"
        modifierCanBeSelectedMultipleTimes:
          type: boolean
          description: If the same modifier can be selected multiple times
          example: true
        alwaysShowModifiers:
          type: boolean
          description: If modifiers should always be shown
          example: false
      required:
        - id
        - name
        - type

    MenuItem:
      type: object
      description: Individual item within a menu
      properties:
        id:
          type: string
          description: Unique identifier of the menu item
          example: "menuitem-001"
        name:
          type: array
          description: Name of the menu item (multiple lines possible)
          items:
            type: string
          example: ["Cheeseburger", "with fries"]
        row:
          type: integer
          description: Row position of the menu item in the grid
          example: 1
        col:
          type: integer
          description: Column position of the menu item in the grid
          example: 3
        function:
          description: Function performed by this menu item (oneOf)
          oneOf:
            - $ref: '#/components/schemas/MenuArticle'
            - $ref: '#/components/schemas/ArticleFilter'
            - $ref: '#/components/schemas/MenuItemFunctionCourse'
            - $ref: '#/components/schemas/MenuItemFunctionOrder'
            - $ref: '#/components/schemas/ModifierFunction'
            - $ref: '#/components/schemas/MenuItemFunctionInput'
            - $ref: '#/components/schemas/MenuItemFunctionDiscountLevel'
            - $ref: '#/components/schemas/MenuItemFunctionPartner'
            - $ref: '#/components/schemas/MenuItemFunctionSubMenu'
        backColor:
          type: string
          description: Background color as RGBA hex string
          example: "#FF0000FF"
        foreColor:
          type: string
          description: Foreground color as RGBA hex string
          example: "#FFFFFFFF"
        fontSize:
          type: number
          format: float
          description: Font size of the menu item text
          example: 14.0
        binaryData:
          type: array
          description: Binary data (e.g., image, audio)
          items:
            $ref: '#/components/schemas/BinaryData'
        fixedPriceLevelId:
          type: string
          description: Price level ID to use for this menu item
          example: "pricelevel-happy-hour"
      required:
        - id

    MenuArticle:
      type: object
      description: Menu function that books one or more articles
      properties:
        articles:
          type: array
          description: Articles to book
          items:
            $ref: '#/components/schemas/Article'
      required:
        - articles

    Article:
      type: object
      description: Article (product) definition
      properties:
        id:
          type: string
          description: Unique identifier of the article
          example: "article-001"
        name:
          type: string
          description: Display name of the article
          example: "Cheeseburger"
        price:
          type: number
          format: double
          description: Price for the article (determined by price level). Can be overridden if allowManualPrice is true
          example: 12.50
        modifierMenuId:
          type: array
          description: Modifier menus to show after booking the article
          items:
            type: string
          example: ["menu-burger-extras"]
        courseGroupId:
          type: string
          description: Course group to which the article belongs
          example: "coursegroup-main"
        courseId:
          type: string
          description: Default course for this article
          example: "course-main"
        restrictions:
          type: array
          description: Restrictions for the article (e.g., age, allergens)
          items:
            $ref: '#/components/schemas/ArticleFilter'
        additionalArticleIds:
          type: array
          description: Additional article identifiers (PLU, EAN, etc.)
          items:
            $ref: '#/components/schemas/AdditionalArticleId'
        articleSet:
          type: array
          description: Articles to book as a set with this article
          items:
            $ref: '#/components/schemas/Article'
        binaryData:
          type: array
          description: Binary data (e.g., image)
          items:
            $ref: '#/components/schemas/BinaryData'
        articleGroup:
          type: string
          description: Article group identifier
          example: "burgers"
        allowManualPrice:
          type: boolean
          description: Price can be overridden by the user
          example: false
        manualMinPrice:
          type: number
          format: double
          description: Minimum price the user can enter (for manual pricing)
          example: 1.00
        manualMaxPrice:
          type: number
          format: double
          description: Maximum price the user can enter (for manual pricing)
          example: 100.00
        isUnavailable:
          type: boolean
          description: If true, the article is currently unavailable and cannot be booked
          example: false
        isLocked:
          type: boolean
          description: If true, the article is locked and cannot be booked
          example: false
        priceFactorForMainArticle:
          type: number
          format: double
          description: Price factor for the main article (if this article is a modifier)
          example: 0.5
        priceFactorRoundingAccuracy:
          type: number
          format: double
          description: Rounding accuracy for the price factor (e.g., 0.05 for 5 cent steps)
          example: 0.05
        allowManualName:
          type: boolean
          description: Name can be overridden by the user
          example: false
        availableQuantity:
          type: number
          format: double
          description: Available quantity of the article
          example: 25
        vatRate:
          type: number
          format: float
          description: VAT rate for the article
          example: 0.19
        vatRateType:
          $ref: '#/components/schemas/TaxType'
        isScaleItem:
          type: boolean
          description: If true, the article needs to be weighed on sale
          example: false
      required:
        - id
        - name

    AdditionalArticleId:
      type: object
      description: Additional identifier for an article
      properties:
        id:
          type: string
          description: The additional identifier value
          example: "4006381333931"
        type:
          $ref: '#/components/schemas/ArticleIdType'
      required:
        - id
        - type

    ArticleFilter:
      type: object
      description: Filter or restriction for articles
      properties:
        id:
          type: string
          description: Unique identifier of the filter
          example: "filter-gluten"
        name:
          type: string
          description: Display name of the filter
          example: "Gluten-free"
        type:
          $ref: '#/components/schemas/MenuItemFunctionFilterType'
      required:
        - id
        - type

    MenuItemFunctionCourse:
      type: object
      description: Menu function that activates a course preselection
      properties:
        id:
          type: string
          description: Course ID to preselect
          example: "course-dessert"
      required:
        - id

    MenuItemFunctionOrder:
      type: object
      description: Menu function that temporarily switches to a defined order
      properties:
        id:
          type: string
          description: Order ID to switch to
          example: "order-001"
      required:
        - id

    MenuItemFunctionInput:
      type: object
      description: Menu function that shows an input field
      properties:
        type:
          $ref: '#/components/schemas/MenuItemFunctionInputType'
      required:
        - type

    MenuItemFunctionDiscountLevel:
      type: object
      description: Menu function that applies a discount level
      properties:
        id:
          type: string
          description: Discount level ID to apply
          example: "discount-20"
      required:
        - id

    MenuItemFunctionPartner:
      type: object
      description: Menu function that performs a partner function
      properties:
        partner:
          $ref: '#/components/schemas/Partner'
        type:
          $ref: '#/components/schemas/MenuItemFunctionPartnerType'
        additionalData:
          type: string
          description: Additional data for the partner function (e.g., article ID for voucher credit)
          example: "voucher-article-001"
      required:
        - type
        - additionalData

    MenuItemFunctionSubMenu:
      type: object
      description: Menu function that opens another menu
      properties:
        id:
          type: string
          description: ID of the sub menu to open
          example: "menu-drinks"
      required:
        - id

    ReceiptPrinter:
      type: object
      description: Receipt printer definition
      properties:
        id:
          type: string
          description: Unique identifier of the printer
          example: "printer-001"
        name:
          type: string
          description: Display name of the printer
          example: "Front Desk Printer"
      required:
        - id
        - name

    CancellationReason:
      type: object
      description: Reason for cancelling an order item
      properties:
        id:
          type: string
          description: Unique identifier of the cancellation reason
          example: "cancel-wrong-order"
        name:
          type: string
          description: Display name of the cancellation reason
          example: "Wrong order"
      required:
        - id
        - name

    OutletArticleGroupMapping:
      type: object
      description: Filter for outlet and article group combinations (AND logic)
      properties:
        outletId:
          type: string
          description: Outlet ID to filter by
          example: "outlet-001"
        articleGroupId:
          type: string
          description: Article group ID to filter by
          example: "articlegroup-food"

    # ==========================================================================
    # BASE DATA REQUEST/RESPONSE SCHEMAS
    # ==========================================================================

    GetPointsOfSaleRequest:
      type: object
      description: Request to retrieve points of sale
