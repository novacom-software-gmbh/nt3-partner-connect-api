    # ==========================================================================
    # BOOKING REQUEST/RESPONSE SCHEMAS
    # ==========================================================================

    GetOrdersRequest:
      type: object
      description: Request to retrieve orders
      properties:
        header:
          $ref: '#/components/schemas/Header'
        orderIds:
          type: array
          description: Filter by order IDs
          items:
            type: string
          example: ["order-001", "order-002"]
        subOrderIds:
          type: array
          description: Filter by sub-order IDs
          items:
            type: string
        outletIds:
          type: array
          description: Filter by outlet IDs
          items:
            type: string
        userIds:
          type: array
          description: Filter by user IDs (only works if all orders are displayed for POS)
          items:
            type: string
      required:
        - header

    GetOrdersResponse:
      type: object
      description: Response containing list of orders
      properties:
        status:
          $ref: '#/components/schemas/Status'
        orders:
          type: array
          items:
            $ref: '#/components/schemas/Order'
      required:
        - status

    GetOrderItemsRequest:
      type: object
      description: Request to retrieve order items
      properties:
        header:
          $ref: '#/components/schemas/Header'
        orderId:
          type: string
          description: Order ID
          example: "order-001"
        subOrderId:
          type: string
          description: Sub-order ID
          example: "suborder-001"
      required:
        - header
        - orderId

    GetOrderItemsResponse:
