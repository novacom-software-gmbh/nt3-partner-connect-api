    DeleteDisplayOrderItemRequest:
      type: object
      description: Request to delete a display order item
      properties:
        header:
          $ref: '#/components/schemas/Header'
        orderId:
          $ref: '#/components/schemas/OrderId'
        orderItemId:
          type: string
          description: Order item ID
          example: "item-001"
        orderItemSubId:
          type: string
          description: Order item sub-ID
          example: "subitem-001"
      required:
        - header

    DeleteDisplayOrderItemResponse:
      type: object
      description: Response after deleting display order item
      properties:
        status:
          $ref: '#/components/schemas/Status'
      required:
        - status

    # ==========================================================================
    # ENUMS
    # ==========================================================================

    LogType:
      type: string
      description: Type of log to target
      enum:
        - APPLICATION
        - COMMUNICATION
      example: "APPLICATION"

    LogLevelType:
      type: string
      description: Severity level of logging
      enum:
        - ERROR
        - WARNING
        - INFO
        - DEBUG
      example: "INFO"

    # ==========================================================================
    # BASE DATA ENUMS
    # ==========================================================================

    WorkflowType:
      type: string
      description: Workflow type of the point of sale
      enum:
        - TABLE_SERVICE
        - SELF_SERVICE
        - SELF_ORDER
      example: "TABLE_SERVICE"

    AskForGuestCountType:
      type: string
      description: When to ask for guest count
      enum:
        - ON_ORDER_OPEN
        - ON_INVOICE
        - NEVER
      example: "ON_ORDER_OPEN"

    AskForOutletType:
      type: string
      description: When to ask for outlet selection
      enum:
        - ON_ORDER_OPEN
        - ON_INVOICE
        - NEVER
      example: "ON_ORDER_OPEN"

    PointOfSaleOrderDisplayOption:
      type: string
      description: Which orders are displayed for a point of sale
      enum:
        - ALL
        - OWN
        - OUTLET
      example: "ALL"

    HardwareType:
      type: string
      description: Type of hardware device
      enum:
        - PRINTER
        - SCANNER
        - SCALE
        - PAYMENT_TERMINAL
        - DISPLAY
      example: "PRINTER"

    MediumWorkflowType:
      type: string
      description: Workflow type for medium handling
      enum:
        - NONE
        - CARD
        - NFC
      example: "CARD"

    DisplayOrderStateType:
      type: string
      description: Order state to display
      enum:
        - NEW
        - IN_PROGRESS
        - READY
        - DELIVERED
      example: "NEW"

    PaymentTypeMode:
      type: string
      description: Mode of payment type
      enum:
        - CASH
        - CARD
        - VOUCHER
        - ROOM_CHARGE
        - PARTNER
      example: "CASH"

    InputType:
      type: string
      description: Default input type for payment
      enum:
        - NFC
        - MANUAL
        - CHIP
        - SWIPE
      example: "NFC"

    MenuType:
      type: string
      description: Type of menu
      enum:
        - HOME
        - MODIFIER
        - FAVORITES
      example: "HOME"

    ArticleIdType:
      type: string
      description: Type of additional article identifier
      enum:
        - PLU
        - EAN
        - BARCODE
        - SKU
      example: "EAN"

    MenuItemFunctionFilterType:
      type: string
      description: Type of menu item filter
      enum:
        - ALLERGEN
        - INGREDIENT
        - DIETARY
        - AGE_RESTRICTION
      example: "ALLERGEN"

    MenuItemFunctionInputType:
      type: string
      description: Type of input field
      enum:
        - NUMPAD
        - TEXT
        - QUANTITY
      example: "NUMPAD"

    MenuItemFunctionPartnerType:
      type: string
      description: Type of partner function
      enum:
        - INFO
        - CREDIT
        - DEBIT
        - SALE
        - BALANCE
      example: "INFO"

    TaxType:
      type: string
      description: Type of tax/VAT rate
      enum:
        - STANDARD
        - REDUCED
        - ZERO
        - EXEMPT
      example: "STANDARD"

    # ==========================================================================
    # PARTNER SCHEMAS
    # ==========================================================================

    Partner:
      type: object
      description: |
        Partner integration definition (e.g., hotel system, access control, voucher system).
        The data field may contain partner-specific JSON data:
        - HOTEL PARTNER: "roomNumbers" (array of room numbers)
      properties:
        id:
          type: string
          description: Unique identifier of the partner
          example: "partner-hotel-001"
        name:
          type: string
          description: Display name of the partner
          example: "Grand Hotel PMS"
        type:
          $ref: '#/components/schemas/PartnerSystemType'
        data:
          type: string
          description: Additional partner-specific data as JSON
          example: '{"roomNumbers": ["101", "102", "103"]}'
      required:
        - id
        - name
        - type

    Medium:
      type: object
      description: |
        Medium representing a card, voucher, reservation, or other identifier.
        The data field may contain partner-specific JSON data:
        - HOTEL PARTNER: "roomNumber", "reservationNumber", "arrangementCode"
      properties:
        id:
          type: string
          description: ID of the medium (e.g., reservation number, chip ID, QR code)
          example: "RES-2024-001"
        name:
          type: string
          description: Display name of the medium
          example: "Room 101 - Smith"
        type:
          $ref: '#/components/schemas/MediumType'
        discountId:
          type: string
          description: Discount ID to apply for this medium
          example: "discount-vip"
        grantId:
          type: string
          description: Grant ID to apply for this medium
          example: "grant-allinclusive"
        priceLevelId:
          type: string
          description: Price level ID to apply for this medium
          example: "pricelevel-member"
        paymentTypeId:
          type: string
          description: Payment type ID assigned to this medium
          example: "payment-room-charge"
        activationDate:
          type: string
          description: Date when medium becomes active (e.g., check-in date)
          example: "2024-01-15T14:00:00Z"
        expirationDate:
          type: string
          description: Date when medium expires (e.g., check-out date)
          example: "2024-01-20T11:00:00Z"
        owners:
          type: array
          description: Owner(s) of the medium
          items:
            $ref: '#/components/schemas/Owner'
        balance:
          $ref: '#/components/schemas/Balance'
        data:
          type: string
          description: Additional partner-specific data as JSON
          example: '{"roomNumber": "101", "reservationNumber": "RES-2024-001"}'
        inputType:
          $ref: '#/components/schemas/InputType'
        templateId:
          type: string
          description: Template ID used for this medium (e.g., voucher template)
          example: "template-gift-voucher"
        useMediumId:
          type: string
          description: ID of the medium to use when booking (e.g., reservation ID for hotel)
          example: "RES-2024-001"
        usePartnerId:
          type: string
          description: ID of the partner to use when booking. Empty uses mapped default partner
          example: "partner-hotel-001"

    Owner:
      type: object
      description: Owner information for a medium or payment
      properties:
        id:
          type: string
          description: Unique identifier of the owner
          example: "owner-001"
        title:
          type: string
          description: Title (e.g., Mr., Mrs., Dr.)
          example: "Mr."
        firstName:
          type: string
          description: First name
          example: "John"
        lastName:
          type: string
          description: Last name
          example: "Smith"
        street:
          type: string
          description: Street address
          example: "123 Main Street"
        city:
          type: string
          description: City
          example: "Vienna"
        zip:
          type: string
          description: Postal/ZIP code
          example: "1010"
        country:
          type: string
          description: Country code or name
          example: "AT"

    Balance:
      type: object
      description: Balance information for a medium
      properties:
        currency:
          type: string
          description: Currency code
          example: "EUR"
        amount:
          type: number
          format: double
          description: Current balance amount
          example: 150.00
        debitLimit:
          type: number
          format: double
          description: Maximum debit allowed
          example: 500.00
        creditLimit:
          type: number
          format: double
          description: Maximum credit allowed
          example: 0.00

    Item:
      type: object
      description: Line item for partner transactions
      properties:
        articleId:
          type: string
          description: Article ID
          example: "article-001"
        articleName:
          type: string
          description: Article name
          example: "Cheeseburger"
        articleGroupId:
          type: string
          description: Article group ID
          example: "group-food"
        quantity:
          type: number
          format: double
          description: Quantity of items (negative for cancellations)
          example: 2.0
        amount:
          type: number
          format: double
          description: Amount per item (discount already subtracted)
          example: 12.50
        discount:
          type: number
          format: double
          description: Total discount for these items
          example: 2.50
        taxPercent:
          type: number
          format: double
          description: Tax percentage
          example: 19.0
        currency:
          type: string
          description: Currency code
          example: "EUR"
        taxType:
          $ref: '#/components/schemas/TaxType'
        isTip:
          type: boolean
          description: If true, this item is a tip
          example: false

    Payment:
      type: object
      description: Payment information for partner transactions
      properties:
        paymentTypeId:
          type: string
          description: Payment type ID
          example: "payment-room-charge"
        amount:
          type: number
          format: double
          description: Payment amount
          example: 25.00
        medium:
          $ref: '#/components/schemas/Medium'
        owner:
          $ref: '#/components/schemas/Owner'
        currency:
          type: string
          description: Currency code
          example: "EUR"
        isTip:
          type: boolean
          description: If true, this payment is a tip
          example: false

    PartnerOrderItem:
      type: object
      description: Order item associated with a partner and medium
      properties:
        partner:
          $ref: '#/components/schemas/Partner'
        medium:
          $ref: '#/components/schemas/Medium'
        item:
          $ref: '#/components/schemas/Item'

    # ==========================================================================
    # PARTNER ENUMS
    # ==========================================================================

    PartnerSystemType:
      type: string
      description: Type of partner system
      enum:
        - HOTEL
        - ACCESS
        - VOUCHER
        - LOYALTY
        - PAYMENT
      example: "HOTEL"

    MediumType:
      type: string
      description: Type of medium
      enum:
        - HOTEL_RESERVATION
        - ACCESS_CARD
        - VOUCHER
        - LOYALTY_CARD
        - NFC_TAG
        - QR_CODE
      example: "HOTEL_RESERVATION"

    BinaryType:
      type: string
      description: Type of binary data
      enum:
        - IMAGE
        - AUDIO
        - VIDEO
        - DOCUMENT
      example: "IMAGE"

    # ==========================================================================
    # BOOKING ENUMS
    # ==========================================================================

    OrderType:
      type: string
      description: Type of order
      enum:
        - TABLE_SERVICE
        - SELF_SERVICE
        - TAKEAWAY
        - DELIVERY
      example: "TABLE_SERVICE"

    OrderStateType:
      type: string
      description: State of an order item
      enum:
        - OPEN
        - BOOKED
        - CANCELLED
        - INVOICED
      example: "OPEN"

    SignatureFormat:
      type: string
      description: Format of fiscalization signature
      enum:
        - QR_CODE
        - BARCODE
        - TEXT
      example: "QR_CODE"

    SignatureType:
      type: string
      description: Type of fiscalization signature
      enum:
        - FISCAL
        - DIGITAL
      example: "FISCAL"

    # ==========================================================================
    # PARTNER REQUEST/RESPONSE SCHEMAS
    # ==========================================================================

    GetPartnersRequest:
      type: object
      description: Request to retrieve partners
      properties:
        header:
          $ref: '#/components/schemas/Header'
        partnerIds:
          type: array
          description: Filter by partner IDs
          items:
            type: string
          example: ["partner-hotel-001"]
        partnerSystemType:
          $ref: '#/components/schemas/PartnerSystemType'
      required:
        - header

    GetPartnersResponse:
      type: object
      description: Response containing list of partners
      properties:
        status:
          $ref: '#/components/schemas/Status'
        partners:
          type: array
          items:
            $ref: '#/components/schemas/Partner'
      required:
        - status

    GetMediumsRequest:
      type: object
      description: |
        Request to retrieve mediums from a partner.
        
        Search data examples by partner type:
        - **HOTEL**: `{"name": "Smith", "roomNumber": "101", "filter": {"roomNumbers": ["101", "102"]}}`
        - **ACCESS**: `{"cardNumber": "12345678"}`
      properties:
        header:
          $ref: '#/components/schemas/Header'
        partner:
          $ref: '#/components/schemas/Partner'
        mediums:
          type: array
          description: Specific mediums to retrieve
          items:
            $ref: '#/components/schemas/Medium'
        searchData:
          type: string
          description: Additional search criteria as JSON
          example: '{"name": "Smith", "roomNumber": "101"}'
      required:
        - header

    GetMediumsResponse:
      type: object
      description: Response containing list of mediums
      properties:
        status:
          $ref: '#/components/schemas/Status'
        mediums:
          type: array
          items:
            $ref: '#/components/schemas/Medium'
      required:
        - status

    BookMediumRequest:
      type: object
      description: Request to book a transaction against a medium
      properties:
        header:
          $ref: '#/components/schemas/Header'
        partner:
          $ref: '#/components/schemas/Partner'
        medium:
          $ref: '#/components/schemas/Medium'
        bookingType:
          $ref: '#/components/schemas/MediumBookingType'
        payments:
          type: array
          description: Payments for the booking
          items:
            $ref: '#/components/schemas/Payment'
        items:
          type: array
          description: Items to book
          items:
            $ref: '#/components/schemas/Item'
        invoiceId:
          type: string
          description: Invoice ID from POS
          example: "inv-001"
        transactionId:
          type: string
          description: Transaction ID from POS
          example: "txn-001"
        isCancellation:
          type: boolean
          description: If true, this is a cancellation booking
          example: false
      required:
        - header

    BookMediumResponse:
      type: object
      description: Response from medium booking
      properties:
        status:
          $ref: '#/components/schemas/Status'
        approvedAmount:
          type: number
          format: double
          description: Approved amount for the booking
          example: 50.00
        newBalance:
          $ref: '#/components/schemas/Balance'
        invoiceId:
          type: string
          description: Invoice ID from partner
          example: "partner-inv-001"
        transactionId:
          type: string
          description: Transaction ID from partner
          example: "partner-txn-001"
      required:
        - status

    # ==========================================================================
    # FISCALIZATION SCHEMAS
    # ==========================================================================

    CustomerFiscalData:
      type: object
      description: Customer fiscal information for tax compliance
      properties:
        name:
          type: string
          description: Name of the customer or company
          example: "Acme Corporation"
        nameAddition:
          type: string
          description: Additional name information
          example: "European Branch"
        street:
          type: string
          description: Street address
          example: "Main Street"
        streetNumber:
          type: string
          description: Street number
          example: "123"
        city:
          type: string
          description: City
          example: "Vienna"
        zip:
          type: string
          description: Postal/ZIP code
          example: "1010"
        country:
          type: string
          description: Country code
          example: "AT"
        vatId:
          type: string
          description: VAT ID including country code
          example: "ATU12345678"
        taxId:
          type: string
          description: Tax ID
          example: "123/456/78901"
        eInvoiceId:
