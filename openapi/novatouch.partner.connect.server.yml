        userName:
          type: string
          description: User name owning the order
          example: "John Smith"

    DisplayOrderItem:
      type: object
      description: Item on a display order
      properties:
        id:
          type: string
          description: Item ID
          example: "item-001"
        subId:
          type: string
          description: Item sub-ID
          example: "subitem-001"
        articleId:
          type: string
          description: Article ID
          example: "article-001"
        name:
          type: string
          description: Item name
          example: "Cheeseburger"
        quantity:
          type: number
          format: double
          description: Quantity
          example: 2.0
        bookedAt:
          type: string
          description: Booking timestamp
          example: "2024-01-15T12:35:00Z"
        outletId:
          type: string
          description: Outlet ID
          example: "outlet-001"
        state:
