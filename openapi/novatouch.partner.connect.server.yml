    GetTransactionTypesRequest:
      type: object
      description: Request to retrieve transaction types
      properties:
        header:
          $ref: '#/components/schemas/Header'
        transactionTypeIds:
          type: array
          description: Filter by specific transaction type IDs. If empty, returns all.
          items:
            type: string
          example: ["trans-001"]
        onlyAssignedToOrderId:
          type: string
          description: Only return the transaction type assigned to this order ID
          example: "order-001"
