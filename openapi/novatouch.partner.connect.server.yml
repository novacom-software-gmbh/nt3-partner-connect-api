          type: string
          description: Creation timestamp
          example: "2024-01-15T12:30:00Z"
        modifiedAt:
          type: string
          description: Last modification timestamp
          example: "2024-01-15T12:45:00Z"
        outletId:
          type: string
          description: Outlet ID
          example: "outlet-001"
        items:
          type: array
          description: Display order items
