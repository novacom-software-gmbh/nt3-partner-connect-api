        - header

    GetTransactionTypesResponse:
      type: object
      description: Response containing list of transaction types
      properties:
        status:
          $ref: '#/components/schemas/Status'
        transactionTypes:
          type: array
          items:
            $ref: '#/components/schemas/TransactionType'
      required:
        - status

    GetPaymentTypesRequest:
      type: object
      description: Request to retrieve payment types
      properties:
        header:
          $ref: '#/components/schemas/Header'
        paymentTypeIds:
          type: array
          description: Filter by specific payment type IDs. If empty, returns all.
          items:
            type: string
          example: ["payment-cash", "payment-card"]
      required:
        - header

    GetPaymentTypesResponse:
      type: object
