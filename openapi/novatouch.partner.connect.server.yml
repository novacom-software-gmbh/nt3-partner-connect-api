          example: 45.50
        discountAmount:
          type: number
          format: double
          description: Discount amount applied
          example: 5.00
        discountId:
          type: string
          description: Discount ID applied
          example: "discount-001"
        discountName:
          type: string
          description: Discount name applied
          example: "Happy Hour"
      required:
        - status

