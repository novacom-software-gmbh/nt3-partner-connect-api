openapi: 3.0.3
info:
  title: POS API
  description: Point of Sale API for managing orders, invoices, and system operations
  version: 1.0.0
  contact:
    name: API Support
    email: support@example.com
    url: https://example.com/support

servers:
  - url: https://api.example.com/api/v1
    description: Production server (placeholder - update with actual server URL)

tags:
  - name: Authentication
    description: Device authorization and user authentication endpoints
  - name: System
    description: System management, health checks, and logging configuration endpoints
  - name: Base Data
    description: Master data endpoints for points of sale, users, menus, articles, and other configuration data
  - name: Booking
    description: Order management, invoicing, and display order endpoints
  - name: Partner
    description: Partner integrations for hotel, access control, voucher systems, and medium management
  - name: Fiscalization
    description: Fiscal compliance, tax reporting, and regulatory requirements

security:
  - AuthorizationToken: []
  - LoginToken: []

paths:
  # ============================================================================
  # SYSTEM ENDPOINTS
  # ============================================================================

  /check/service:
    get:
      tags:
        - System
      summary: Check service health
      description: Performs a health check on the POS service to verify it is operational and responding.
      operationId: checkService
      security: []
      responses:
        '200':
          description: Service health check response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckServiceResponse'
        '500':
          description: Internal server error - service unavailable

  /system/changepointofsale:
    post:
      tags:
        - System
      summary: Change point of sale
      description: Changes the active point of sale for the current session. Returns a new login token with updated permissions for the new point of sale.
      operationId: changePointOfSale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePointOfSaleRequest'
      responses:
        '200':
          description: Point of sale change response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangePointOfSaleResponse'
        '400':
          description: Bad request - invalid point of sale ID
        '401':
          description: Unauthorized - invalid or missing token
        '403':
          description: Forbidden - insufficient permissions for requested point of sale
        '404':
          description: Not found - point of sale does not exist
        '500':
          description: Internal server error

  /system/setloglevel:
    post:
      tags:
        - System
      summary: Set log level
      description: Updates the log level for a specified log type. This controls the verbosity of logging for debugging and monitoring purposes.
      operationId: setLogLevel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetLogLevelRequest'
      responses:
        '200':
          description: Log level updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetLogLevelResponse'
        '400':
          description: Bad request - invalid log type or level
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - insufficient permissions
        '500':
          description: Internal server error

  /system/getloglevel:
    post:
      tags:
        - System
      summary: Get log level
      description: Retrieves the current log level setting for a specified log type.
      operationId: getLogLevel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetLogLevelRequest'
      responses:
        '200':
          description: Current log level for the specified log type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetLogLevelResponse'
        '400':
          description: Bad request - invalid log type
        '401':
          description: Unauthorized
        '500':
          description: Internal server error

  /system/addlogentry:
    post:
      tags:
        - System
      summary: Add log entry
      description: Adds a new log entry to the system logs. Useful for client-side logging that needs to be centralized with server logs.
      operationId: addLogEntry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddLogEntryRequest'
      responses:
        '200':
          description: Log entry added successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddLogEntryResponse'
        '400':
          description: Bad request - invalid parameters
        '401':
          description: Unauthorized
        '500':
          description: Internal server error

  # ============================================================================
  # AUTHENTICATION ENDPOINTS
  # ============================================================================

  /authorization/authorize:
    post:
      tags:
        - Authentication
      summary: Authorize device
      description: |
        Authorizes a device to use the POS system. Returns an authorization token containing:
        - Permissions for this device
        - Customer ID
        - Client ID
      operationId: authorize
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorizeRequest'
      responses:
        '200':
          description: Authorization response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizeResponse'
        '400':
          description: Bad request - invalid parameters
        '401':
          description: Unauthorized - invalid API key
        '500':
          description: Internal server error

  /authorization/login:
    post:
      tags:
        - Authentication
      summary: User login
      description: |
        Logs in a user to the POS system. Returns a login token containing:
        - User permissions for the logged in user
        - User ID
      operationId: login
      security:
        - AuthorizationToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Bad request - invalid parameters
        '401':
          description: Unauthorized - invalid credentials
        '500':
          description: Internal server error

  /authorization/logout:
    post:
      tags:
        - Authentication
      summary: User logout
      description: Logs out the currently authenticated user from the POS system.
      operationId: logout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '200':
          description: Logout response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '500':
          description: Internal server error

  # ============================================================================
  # BASE DATA ENDPOINTS
  # ============================================================================

  /basedata/getpointsofsale:
    post:
      tags:
        - Base Data
      summary: Get points of sale
      description: Retrieves a list of points of sale. Can be filtered by specific point of sale IDs.
      operationId: getPointsOfSale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetPointsOfSaleRequest'
      responses:
        '200':
          description: List of points of sale
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetPointsOfSaleResponse'
        '400':
          description: Bad request - invalid parameters
        '401':
          description: Unauthorized
        '500':
          description: Internal server error

  /basedata/getusers:
    post:
      tags:
        - Base Data
      summary: Get users
      description: Retrieves a list of users. Can be filtered by specific user IDs.
      operationId: getUsers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetUsersRequest'
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetUsersResponse'
        '400':
          description: Bad request - invalid parameters
        '401':
          description: Unauthorized
        '500':
          description: Internal server error

  /basedata/getoutlets:
    post:
      tags:
        - Base Data
      summary: Get outlets
      description: Retrieves a list of outlets (service areas). Can be filtered by specific outlet IDs.
      operationId: getOutlets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetOutletsRequest'
      responses:
        '200':
          description: List of outlets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetOutletsResponse'
        '400':
          description: Bad request - invalid parameters
        '401':
          description: Unauthorized
        '500':
          description: Internal server error

  /basedata/getdiscounts:
    post:
      tags:
        - Base Data
      summary: Get discounts
      description: Retrieves a list of available discounts. Can be filtered by specific discount IDs.
      operationId: getDiscounts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetDiscountsRequest'
      responses:
        '200':
          description: List of discounts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetDiscountsResponse'
        '400':
          description: Bad request - invalid parameters
        '401':
          description: Unauthorized
        '500':
          description: Internal server error

  /basedata/getcoursegroups:
    post:
      tags:
        - Base Data
      summary: Get course groups
      description: Retrieves a list of course groups with their associated courses. Can be filtered by specific course group IDs.
      operationId: getCourseGroups
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetCourseGroupsRequest'
      responses:
        '200':
          description: List of course groups
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetCourseGroupsResponse'
        '400':
          description: Bad request - invalid parameters
        '401':
          description: Unauthorized
        '500':
          description: Internal server error

  /basedata/gettransactiontypes:
    post:
      tags:
        - Base Data
      summary: Get transaction types
      description: Retrieves a list of transaction types. Can be filtered by specific transaction type IDs or by order assignment.
      operationId: getTransactionTypes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetTransactionTypesRequest'
      responses:
        '200':
          description: List of transaction types
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetTransactionTypesResponse'
        '400':
          description: Bad request - invalid parameters
        '401':
          description: Unauthorized
        '500':
          description: Internal server error

  /basedata/getpaymenttypes:
    post:
      tags:
        - Base Data
      summary: Get payment types
      description: Retrieves a list of payment types (cash, card, etc.). Can be filtered by specific payment type IDs.
      operationId: getPaymentTypes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetPaymentTypesRequest'
      responses:
        '200':
          description: List of payment types
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetPaymentTypesResponse'
        '400':
          description: Bad request - invalid parameters
        '401':
          description: Unauthorized
        '500':
          description: Internal server error

  /basedata/getreceiptprinters:
    post:
      tags:
        - Base Data
      summary: Get receipt printers
      description: Retrieves a list of available receipt printers. Can be filtered by specific printer IDs.
      operationId: getReceiptPrinters
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetReceiptPrintersRequest'
      responses:
        '200':
          description: List of receipt printers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetReceiptPrintersResponse'
        '400':
          description: Bad request - invalid parameters
        '401':
          description: Unauthorized
        '500':
          description: Internal server error

  /basedata/getarticles:
    post:
      tags:
        - Base Data
      summary: Get articles
      description: Retrieves a list of articles (products). Can be filtered by article IDs or codes (EAN, barcode). Prices are determined by the optional order/payment context.
      operationId: getArticles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetArticlesRequest'
      responses:
        '200':
          description: List of articles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetArticlesResponse'
        '400':
          description: Bad request - invalid parameters
        '401':
          description: Unauthorized
        '500':
          description: Internal server error

  /basedata/getcancellationreasons:
    post:
      tags:
        - Base Data
      summary: Get cancellation reasons
      description: Retrieves a list of cancellation reasons that can be used when voiding items or orders.
      operationId: getCancellationReasons
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetCancellationReasonsRequest'
      responses:
        '200':
          description: List of cancellation reasons
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetCancellationReasonsResponse'
        '400':
          description: Bad request - invalid parameters
        '401':
          description: Unauthorized
        '500':
          description: Internal server error

  /basedata/setfavoritesmenu:
    post:
      tags:
        - Base Data
      summary: Set favorites menu
      description: Sets the favorites menu items for the current user. These items will appear in the user's favorites menu for quick access.
      operationId: setFavoritesMenu
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetFavoritesMenuRequest'
      responses:
        '200':
          description: Favorites menu updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetFavoritesMenuResponse'
        '400':
          description: Bad request - invalid parameters
        '401':
          description: Unauthorized
        '500':
          description: Internal server error

  /basedata/getmenus:
    post:
      tags:
        - Base Data
      summary: Get menus
      description: Retrieves a list of menus including home menus and modifier menus. Prices are determined by the optional order/payment context.
      operationId: getMenus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetMenusRequest'
      responses:
        '200':
          description: List of menus
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetMenusResponse'
        '400':
          description: Bad request - invalid parameters
        '401':
          description: Unauthorized
        '500':
          description: Internal server error

  # ============================================================================
  # BOOKING ENDPOINTS
  # ============================================================================

  /booking/getorders:
    post:
      tags:
        - Booking
      summary: Get orders
      description: Retrieves a list of orders. Can be filtered by order IDs, sub-order IDs, outlet IDs, or user IDs.
      operationId: getOrders
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetOrdersRequest'
      responses:
        '200':
          description: List of orders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetOrdersResponse'
        '400':
          description: Bad request - invalid parameters
        '401':
          description: Unauthorized
        '500':
          description: Internal server error

  /booking/getorderitems:
    post:
      tags:
        - Booking
      summary: Get order items
      description: Retrieves all items for a specific order, including pricing and discount information.
      operationId: getOrderItems
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetOrderItemsRequest'
      responses:
        '200':
          description: List of order items with totals
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetOrderItemsResponse'
        '400':
          description: Bad request - invalid parameters
        '401':
          description: Unauthorized
        '404':
          description: Order not found
        '500':
          description: Internal server error

  /booking/openorder:
    post:
      tags:
        - Booking
      summary: Open order
      description: Opens an existing order or creates a new one. Can optionally associate the order with a partner (e.g., hotel room).
      operationId: openOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenOrderRequest'
      responses:
        '200':
          description: Order opened or created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenOrderResponse'
        '400':
          description: Bad request - invalid parameters
        '401':
          description: Unauthorized
        '404':
          description: Order not found
        '500':
          description: Internal server error

  /booking/closeorder:
    post:
      tags:
        - Booking
      summary: Close order
      description: Closes an open order, releasing it for other users or archiving it.
      operationId: closeOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloseOrderRequest'
      responses:
        '200':
          description: Order closed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloseOrderResponse'
        '400':
          description: Bad request - invalid parameters
        '401':
          description: Unauthorized
        '404':
          description: Order not found
        '500':
          description: Internal server error

  /booking/adoptorder:
    post:
      tags:
        - Booking
      summary: Adopt order
      description: Takes ownership of an order from another user.
      operationId: adoptOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdoptOrderRequest'
      responses:
        '200':
          description: Order adopted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdoptOrderResponse'
        '400':
          description: Bad request - invalid parameters
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - cannot adopt this order
        '404':
          description: Order not found
        '500':
          description: Internal server error

  /booking/bookorderitems:
    post:
      tags:
        - Booking
      summary: Book order items
      description: Adds items to an order. Price levels can be determined by the optional payment type.
      operationId: bookOrderItems
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookOrderItemsRequest'
      responses:
        '200':
          description: Items booked successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookOrderItemsResponse'
        '400':
          description: Bad request - invalid parameters
        '401':
          description: Unauthorized
        '404':
          description: Order not found
        '500':
          description: Internal server error

  /booking/createinvoice:
    post:
      tags:
        - Booking
      summary: Create invoice
      description: Creates an invoice for an order with specified payments and items. Can optionally specify a transaction type (no payments allowed in that case).
      operationId: createInvoice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInvoiceRequest'
      responses:
        '200':
          description: Invoice created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateInvoiceResponse'
        '400':
          description: Bad request - invalid parameters
        '401':
          description: Unauthorized
        '404':
          description: Order not found
        '500':
          description: Internal server error

  /booking/splitorder:
    post:
      tags:
        - Booking
      summary: Split order
      description: Splits items from one order to one or more target orders. Can split by amount, divider, or specific items.
      operationId: splitOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SplitOrderRequest'
      responses:
        '200':
          description: Order split successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SplitOrderResponse'
        '400':
          description: Bad request - invalid parameters
        '401':
          description: Unauthorized
        '404':
          description: Order not found
        '500':
          description: Internal server error

  /booking/moveorder:
    post:
      tags:
        - Booking
      summary: Move order
      description: Moves all items from one order to another order.
      operationId: moveOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoveOrderRequest'
      responses:
        '200':
          description: Order moved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoveOrderResponse'
        '400':
          description: Bad request - invalid parameters
        '401':
          description: Unauthorized
        '404':
          description: Order not found
        '500':
          description: Internal server error

  /booking/calculateprices:
    post:
      tags:
        - Booking
      summary: Calculate prices
      description: Calculates prices for items based on order context, payment type, discounts, grants, and price levels.
      operationId: calculatePrices
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalculatePricesRequest'
      responses:
        '200':
          description: Prices calculated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalculatePricesResponse'
        '400':
          description: Bad request - invalid parameters
        '401':
          description: Unauthorized
        '500':
          description: Internal server error

  /booking/assignordertopartnermedium:
    post:
      tags:
        - Booking
      summary: Assign order to partner medium
      description: Assigns an order to a partner medium (e.g., hotel room, loyalty card). Can be permanent or temporary.
      operationId: assignOrderToPartnerMedium
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignOrderToPartnerMediumRequest'
      responses:
        '200':
          description: Order assigned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignOrderToPartnerMediumResponse'
        '400':
          description: Bad request - invalid parameters
        '401':
          description: Unauthorized
        '404':
          description: Order or medium not found
        '500':
          description: Internal server error

  /booking/getinvoices:
    post:
      tags:
        - Booking
      summary: Get invoices
      description: Retrieves full invoice details including items and payments. Can be filtered by user IDs or invoice IDs.
      operationId: getInvoices
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetInvoicesRequest'
      responses:
        '200':
          description: List of invoices with full details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetInvoicesResponse'
        '400':
          description: Bad request - invalid parameters
        '401':
          description: Unauthorized
        '500':
          description: Internal server error

  /booking/getinvoicelist:
    post:
      tags:
        - Booking
      summary: Get invoice list
      description: Retrieves a lightweight list of invoices. Can be filtered by date range, user IDs, or invoice IDs.
      operationId: getInvoiceList
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetInvoiceListRequest'
      responses:
        '200':
          description: List of invoices (lightweight)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetInvoiceListResponse'
        '400':
          description: Bad request - invalid parameters
        '401':
          description: Unauthorized
        '500':
          description: Internal server error

  /booking/cancelinvoice:
    post:
      tags:
        - Booking
      summary: Cancel invoice
      description: Cancels an existing invoice and optionally rebooks items to a new order.
      operationId: cancelInvoice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelInvoiceRequest'
      responses:
        '200':
          description: Invoice cancelled successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelInvoiceResponse'
        '400':
          description: Bad request - invalid parameters
        '401':
          description: Unauthorized
        '404':
          description: Invoice not found
        '500':
          description: Internal server error

  /booking/createinvoicetransactionid:
    post:
      tags:
        - Booking
      summary: Create invoice transaction ID
      description: Creates a unique transaction ID for an invoice, typically used for payment processing.
      operationId: createInvoiceTransactionId
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInvoiceTransactionIdRequest'
      responses:
        '200':
          description: Transaction ID created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateInvoiceTransactionIdResponse'
        '400':
          description: Bad request - invalid parameters
        '401':
          description: Unauthorized
        '500':
          description: Internal server error

  /booking/printinvoice:
    post:
      tags:
        - Booking
      summary: Print invoice
      description: Prints an invoice to a receipt printer. Can be a reprint of an existing invoice.
      operationId: printInvoice
