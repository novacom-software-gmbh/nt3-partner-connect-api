        - status

    GetUsersRequest:
      type: object
      description: Request to retrieve users
      properties:
        header:
          $ref: '#/components/schemas/Header'
        userIds:
          type: array
          description: Filter by specific user IDs. If empty, returns all.
          items:
            type: string
          example: ["user-001", "user-002"]
      required:
