        paymentDeviceId:
          type: string
          description: Payment device/terminal ID
          example: "terminal-001"
        referenceId:
          type: string
          description: Transaction reference ID
          example: "ref-123456"
        paymentTypeMode:
          $ref: '#/components/schemas/PaymentTypeMode'
        customerPrintout:
          type: string
          description: Customer receipt printout (lines separated by \\n)
          example: "Transaction Approved\\nCard: **** 1234"
        merchantPrintout:
          type: string
          description: Merchant receipt printout (lines separated by \\n)
          example: "Transaction Approved\\nMerchant Copy"
        partnerPaymentType:
          type: string
          description: Payment type from partner (e.g., visa, mastercard)
          example: "visa"
        partner:
          $ref: '#/components/schemas/Partner'
        medium:
          $ref: '#/components/schemas/Medium'

    InvoicePayment:
      type: object
      description: Payment information for creating an invoice
