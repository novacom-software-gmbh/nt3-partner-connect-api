    Modifier:
      type: object
      description: Modifier applied to an order item
      properties:
        articleId:
          type: string
          description: Article ID of the modifier
          example: "article-extra-cheese"
        comment:
          type: string
          description: Free-text comment modifier
          example: "No onions"
        binaryData:
          type: array
          description: Binary data
          items:
            $ref: '#/components/schemas/BinaryData'
        modifierFunction:
          $ref: '#/components/schemas/ModifierFunction'
        isPreselection:
          type: boolean
          description: Whether this is a preselection modifier
          example: false
        name:
          type: string
          description: Display name of the modifier
          example: "Extra Cheese"
        price:
          type: number
          format: double
          description: Price of the modifier
          example: 1.50
        bookedFromMenuId:
          type: string
          description: Menu ID the modifier was booked from
          example: "menu-extras"
        bookedFromMenuRow:
          type: integer
          description: Menu row
          example: 1
        bookedFromMenuCol:
          type: integer
          description: Menu column
          example: 2

    PartnerPaymentData:
      type: object
      description: Payment data from a partner (terminal, hotel, etc.)
