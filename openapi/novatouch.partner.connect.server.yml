        - status

    GetMenusRequest:
      type: object
      description: Request to retrieve menus
      properties:
        header:
          $ref: '#/components/schemas/Header'
        orderId:
          type: string
          description: Currently open order to determine the price level
          example: "order-001"
        subOrderId:
          type: string
          description: Currently open sub order to determine the price level
          example: "suborder-001"
        paymentTypeId:
          type: string
          description: Selected payment type to determine the price level
          example: "payment-card"
        menuIds:
          type: array
          description: Filter for menus to get (only filters home menus)
          items:
            type: string
          example: ["menu-main", "menu-drinks"]
      required:
        - header

    GetMenusResponse:
      type: object
      description: Response containing list of menus
      properties:
        status:
          $ref: '#/components/schemas/Status'
        menus:
          type: array
          items:
            $ref: '#/components/schemas/Menu'
      required:
        - status

    GetReceiptPrintersRequest:
      type: object
      description: Request to retrieve receipt printers
      properties:
        header:
          $ref: '#/components/schemas/Header'
        receiptPrinterIds:
          type: array
          description: Filter by specific printer IDs. If empty, returns all.
          items:
            type: string
          example: ["printer-001"]
      required:
        - header

    GetReceiptPrintersResponse:
      type: object
      description: Response containing list of receipt printers
      properties:
        status:
          $ref: '#/components/schemas/Status'
        receiptPrinters:
          type: array
          items:
            $ref: '#/components/schemas/ReceiptPrinter'
      required:
        - status

    GetArticlesRequest:
      type: object
      description: Request to retrieve articles
      properties:
        header:
          $ref: '#/components/schemas/Header'
        articleIds:
          type: array
          description: Article IDs to get
          items:
            type: string
          example: ["article-001", "article-002"]
        orderId:
          type: string
          description: Currently open order to determine the price level
          example: "order-001"
        subOrderId:
          type: string
          description: Currently open sub order to determine the price level
          example: "suborder-001"
        paymentTypeId:
          type: string
          description: Selected payment type to determine the price level
          example: "payment-card"
        articleCodes:
          type: array
          description: Article codes to get (EAN, barcode, etc.) - added to article IDs
          items:
            type: string
          example: ["4006381333931"]
      required:
        - header

    GetArticlesResponse:
      type: object
      description: Response containing list of articles
      properties:
        status:
          $ref: '#/components/schemas/Status'
        articles:
          type: array
          items:
            $ref: '#/components/schemas/Article'
      required:
        - status

    GetCancellationReasonsRequest:
      type: object
      description: Request to retrieve cancellation reasons
      properties:
        header:
          $ref: '#/components/schemas/Header'
        cancellationReasonIds:
          type: array
          description: Filter by specific cancellation reason IDs. If empty, returns all.
          items:
            type: string
          example: ["cancel-001"]
      required:
        - header

    GetCancellationReasonsResponse:
      type: object
      description: Response containing list of cancellation reasons
      properties:
        status:
          $ref: '#/components/schemas/Status'
        cancellationReasons:
          type: array
          items:
            $ref: '#/components/schemas/CancellationReason'
      required:
        - status

    SetFavoritesMenuRequest:
      type: object
      description: Request to set favorites menu items for the current user
      properties:
        header:
          $ref: '#/components/schemas/Header'
        menuItems:
          type: array
          description: Menu items to set as favorites
          items:
            $ref: '#/components/schemas/MenuItem'
      required:
        - header

    SetFavoritesMenuResponse:
      type: object
      description: Response after setting favorites menu
      properties:
        status:
          $ref: '#/components/schemas/Status'
      required:
        - status

    # ==========================================================================
    # BOOKING SCHEMAS
    # ==========================================================================

    OrderId:
      type: object
      description: Order and sub-order ID combination
      properties:
        id:
          type: string
          description: Order ID
          example: "order-001"
        subId:
          type: string
          description: Sub-order ID
          example: "suborder-001"

    Order:
      type: object
      description: Order information
      properties:
        id:
          type: string
          description: Unique identifier of the order
          example: "order-001"
        name:
          type: string
          description: Display name of the order (e.g., table number)
          example: "Table 5"
        balance:
          type: number
          format: float
          description: Current balance of the order
          example: 45.50
        subId:
          type: string
          description: Sub-order ID
          example: "suborder-001"
        createdAt:
          type: string
          description: Creation timestamp
          example: "2024-01-15T12:30:00Z"
        modifiedAt:
          type: string
          description: Last modification timestamp
          example: "2024-01-15T13:45:00Z"
        createdByUserId:
          type: string
          description: User ID who created the order
          example: "user-001"
        modifiedByUserId:
          type: string
          description: User ID who last modified the order
          example: "user-002"
        ownedByUserId:
          type: string
          description: User ID who currently owns the order
          example: "user-001"
        locked:
          type: boolean
          description: Whether the order is locked
          example: false
        guestCount:
          type: integer
          description: Number of guests for this order
          example: 4
        outletId:
          type: string
          description: Outlet ID where this order belongs
          example: "outlet-001"
        orderType:
          $ref: '#/components/schemas/OrderType'
        orderData:
          type: string
          description: Additional generic data for the order as JSON
          example: '{"notes": "Birthday celebration"}'
        partnerData:
          type: array
          description: Partner data associated with the order
          items:
            $ref: '#/components/schemas/PartnerData'
        restrictions:
          type: array
          description: Article restrictions for the order
          items:
            $ref: '#/components/schemas/ArticleFilter'
        availableOrderItemTags:
          type: array
          description: Tags available for booking order items (e.g., seat number)
          items:
            type: string
          example: ["seat-1", "seat-2"]
        binaryData:
          type: array
          description: Binary data (e.g., image)
          items:
            $ref: '#/components/schemas/BinaryData'
        transactionTypeId:
          type: string
          description: If set, order can only be booked with this transaction type
          example: "trans-001"
        discountAmount:
          type: number
          format: double
          description: Amount of discount applied to this order
          example: 5.00
        discountId:
          type: string
          description: ID of discount applied to this order
          example: "discount-001"
        discountName:
          type: string
          description: Name of discount applied to this order
          example: "Happy Hour"
        salesVolumeOutletId:
          type: string
          description: Outlet ID if sales volume is booked for a different outlet
          example: "outlet-002"
        transactionId:
          type: string
          description: Cached transaction ID (usually from a payment attempt)
          example: "txn-001"
      required:
        - id
        - name
        - balance
        - orderType

    OrderItem:
      type: object
      description: Item within an order
      properties:
        articleId:
          type: string
          description: Article ID
          example: "article-001"
        name:
          type: string
          description: Display name of the item
          example: "Cheeseburger"
        quantity:
          type: number
          format: double
          description: Quantity ordered
          example: 2.0
        price:
          type: number
          format: double
          description: Price per item (without discount/grant, happy hour already applied)
          example: 12.50
        binaryData:
          type: array
          description: Binary data (e.g., image)
          items:
            $ref: '#/components/schemas/BinaryData'
        bookedAt:
          type: string
          description: Timestamp when item was booked
          example: "2024-01-15T12:35:00Z"
        outletId:
          type: string
          description: Outlet ID if booked for a different outlet
          example: "outlet-001"
        cancelledByUserId:
          type: string
          description: User ID who cancelled the item
          example: "user-001"
        cancelledAt:
          type: string
          description: Timestamp when item was cancelled
          example: "2024-01-15T13:00:00Z"
        cancellationReason:
          type: string
          description: Reason for cancellation
          example: "Customer changed mind"
        cancellationAuthorizedByUserId:
          type: string
          description: User ID who authorized the cancellation
          example: "user-manager"
        orderState:
          $ref: '#/components/schemas/OrderStateType'
        courseId:
          type: string
          description: Course ID for this item
          example: "course-main"
        courseGroupId:
          type: string
          description: Course group ID for this item
          example: "coursegroup-001"
        modifiers:
          type: array
          description: Modifiers applied to this item
          items:
            $ref: '#/components/schemas/Modifier'
        weight:
          type: number
          format: double
          description: Weight when a scale is used
          example: 0.5
        discountAmount:
          type: number
          format: double
          description: Total discount amount for these items
          example: 2.50
        discountId:
          type: string
          description: Discount ID applied
          example: "discount-001"
        discountName:
          type: string
          description: Discount name applied
          example: "Staff Discount"
        happyHourDiscountAmount:
          type: number
          format: double
          description: Happy hour discount per item (already in price)
          example: 1.00
        happyHourDiscountId:
          type: string
          description: Happy hour discount ID
          example: "happyhour-001"
        happyHourDiscountName:
          type: string
          description: Happy hour discount name
          example: "Evening Special"
        grantAmount:
          type: number
          format: double
          description: Total grant amount for these items
          example: 5.00
        grantId:
          type: string
          description: Grant ID applied
          example: "grant-001"
        grantName:
          type: string
          description: Grant name applied
          example: "All-Inclusive"
        tags:
          type: array
          description: Tags for this item (e.g., seat number)
          items:
            type: string
          example: ["seat-1"]
        bookedFromMenuId:
          type: string
          description: Menu ID the item was booked from
          example: "menu-main"
        bookedFromMenuRow:
          type: integer
          description: Menu row the item was booked from
          example: 2
        bookedFromMenuCol:
          type: integer
          description: Menu column the item was booked from
          example: 3
        useAlternativeVatRate:
          type: boolean
          description: Use alternative VAT rate for this item
          example: false
        isLocked:
          type: boolean
          description: Item is locked and cannot be modified
          example: false
        availableQuantity:
          type: number
          format: double
          description: Available quantity of the article
          example: 10.0
        priceLevelId:
          type: string
          description: Price level ID to use for this item
          example: "pricelevel-001"
        partnerItem:
          $ref: '#/components/schemas/PartnerOrderItem'
        displayOrderState:
          $ref: '#/components/schemas/DisplayOrderStateType'
